<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 Special Cards DataBase</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- PANTALLA DE CARGA -->
    <div id="loading" class="hidden">
        <div class="loader"></div>
        <p>Cargando datos...</p>
    </div>

    <!-- NOTIFICACIÓN DE ERROR -->
    <div id="errorMessage" class="hidden"></div>

    <!-- ENCABEZADO -->
    <header>
        <div class="logo">
            <div> 
                <img src="" alt="">
                <h1>DLS 26 SPA</h1>
                <p>Colección Oficial de Cartas</p>
            </div>
        </div>

        <!-- MINI REPRODUCTOR DE MÚSICA -->
        <div class="music-player">
            <audio id="audioTrack" src="sound 1 dls.mp3"></audio>
            <div class="music-info">
                <span id="trackTitle">🎵 Carga tu música</span>
            </div>
            <div class="music-controls">
                <select id="trackSelect">
                    <!-- Cargado dinámicamente desde el JSON -->
                </select>
                <button id="playPauseBtn">▶</button>
            </div>
        </div>

        <!-- BUSCADOR -->
        <div class="search">
            <input type="text" id="searchInput" placeholder="Buscar jugador, equipo, país, media...">
            <button id="searchButton">Buscar</button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <!-- SECCIÓN DE JUGADORES -->
        <section class="player-list">
            <div class="section-title">
                <h2>Jugadores</h2>
                <span id="playerCounter">0 Jugadores</span>
            </div>

            <div id="playerContainer">
                <!-- Se genera dinámicamente -->
            </div>

            <div class="pagination">
                <button id="previousBtn" disabled>← Anterior</button>
                <button id="nextBtn">Siguiente →</button>
            </div>
        </section>

        <!-- PANEL LATERAL DE DETALLES -->
        <aside class="player-detail">
            <div id="detailContainer">
                <h2>Selecciona un jugador</h2>
                <p>Haz clic en "Ver Información" para examinar los atributos completos.</p>
            </div>
        </aside>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Proyecto SPA utilizando API DLS 26</p>
        <p><small>HTML • CSS • JavaScript • Fetch API</small></p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
